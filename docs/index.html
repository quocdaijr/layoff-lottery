<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layoff Lottery</title>
<meta name="description" content="Every day still employed is a lottery ticket. Count your days, answer the hard question, and see what you could have learned since your start date.">
<style>
  :root { --bg:#14161a; --card:#1e2127; --fg:#e6e6e6; --muted:#8b919c; --accent:#f5c518; --line:#2c3039; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:680px; margin:0 auto; padding:16px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
  h1 { font-size:1.25rem; margin:0; }
  h2 { font-size:1rem; margin:24px 0 8px; }
  button, input { font:inherit; color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 10px; }
  button { cursor:pointer; }
  button.small { padding:2px 8px; font-size:.8rem; }
  .counter { font-size:2.2rem; font-weight:700; color:var(--accent); margin:12px 0 0; }
  .sub { color:var(--muted); margin:0 0 4px; }
  .note { font-size:.8rem; color:var(--muted); }
  dialog { background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:12px; padding:16px; width:min(92vw,360px); }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  dialog h2 { margin:0 0 12px; }
  .radio { display:block; margin:6px 0; cursor:pointer; }
  .dates { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 4px; }
  .dates label { display:flex; flex-direction:column; font-size:.8rem; color:var(--muted); gap:4px; flex:1; }
  menu { display:flex; justify-content:flex-end; gap:8px; padding:0; margin:12px 0 0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .card img { width:100%; border-radius:8px; display:block; margin-bottom:8px; }
  .cap { color:var(--muted); font-size:.9rem; margin-bottom:12px; }
  .row { margin:10px 0; }
  .row b { color:var(--accent); }
  textarea { width:100%; min-height:70px; font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px; }
  .stats { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:8px; }
  .stats div { flex:1 1 120px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; }
  .stats b { display:block; font-size:1.6rem; color:var(--accent); }
  .stats span { color:var(--muted); font-size:.85rem; }
  ul.check { list-style:none; padding:0; margin:0; }
  ul.check li { display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-bottom:1px solid var(--line); }
  ul.check input { margin-top:4px; }
  ul.check li.done { color:var(--muted); text-decoration:line-through; }
  ul.check li.done b { color:var(--muted); }
  .timeline { display:flex; gap:6px; flex-wrap:wrap; }
  .timeline button { padding:4px 8px; font-size:.85rem; }
  .timeline button.on { border-color:var(--accent); color:var(--accent); }
  .hidden { display:none; }
  .owner { display:flex; gap:14px; align-items:center; }
  .owner img { width:64px; height:64px; border-radius:50%; object-fit:cover; flex:none; }
  .owner .q { color:var(--muted); font-size:.9rem; font-style:italic; margin:4px 0; }
  .owner .links a { color:var(--accent); font-size:.85rem; margin-right:10px; text-decoration:none; }
</style>
</head>
<body>
<main>
  <header>
    <h1>🎟 Layoff Lottery</h1>
    <button id="lang"></button>
  </header>

  <p class="counter" id="counter">—</p>
  <p class="sub" id="sub"></p>
  <p class="note"><span id="who"></span> <button id="change" class="small" data-t="change"></button></p>

  <dialog id="dlg">
    <form method="dialog">
      <h2 data-t="setup"></h2>
      <label class="radio"><input type="radio" name="mode" value="owner"> <span data-t="owner"></span></label>
      <label class="radio"><input type="radio" name="mode" value="guest"> <span data-t="guest"></span></label>
      <div id="guestDates" class="dates">
        <label><span data-t="start"></span><input type="date" id="start"></label>
        <label><span data-t="end"></span><input type="date" id="end"></label>
      </div>
      <p class="note" data-t="note"></p>
      <menu><button value="cancel" data-t="cancel"></button><button value="save" data-t="save"></button></menu>
    </form>
  </dialog>

  <section class="card owner hidden" id="ownerCard"></section>

  <section id="personal" class="hidden">
    <section class="card">
      <div class="row"><b>❓ <span data-t="why"></span></b></div>
      <textarea id="why"></textarea>
    </section>

    <h2 data-t="since"></h2>
    <div class="stats">
      <div><b id="sDays">0</b><span data-t="days"></span></div>
      <div><b id="sLessons">0</b><span data-t="lessons"></span></div>
      <div><b id="sSkills">0</b><span data-t="skills"></span></div>
    </div>
    <p class="note" data-t="estNote"></p>

    <h2 data-t="lessonsTitle"></h2>
    <ul class="check" id="lessonList"></ul>
    <h2 data-t="skillsTitle"></h2>
    <ul class="check" id="skillList"></ul>
  </section>

  <section id="bot" class="hidden">
    <h2 data-t="history"></h2>
    <section class="card" id="card"></section>
    <div class="timeline" id="timeline"></div>
  </section>
</main>

<script>
const T = {
  vi: { change:"Đổi", setup:"Xem timeline của ai?", owner:"Chủ bot (ngày lấy từ config, kèm lịch sử Telegram)", guest:"Khách (nhập ngày của bạn, lưu trên máy này)",
        start:"Ngày bắt đầu", end:"Ngày kết thúc (tùy chọn)", note:"Ngày của khách chỉ lưu trong trình duyệt này. Không gửi đi đâu.", cancel:"Hủy", save:"Lưu",
        ownerTag:"Chủ bot", guestTag:"Khách", noStart:"chưa có ngày bắt đầu",
        day:"Ngày", survived:"sống sót", tickets:"vé đã gom", left:"còn", daysLeft:"ngày", open:"không có ngày kết thúc", enter:"Nhập ngày bắt đầu để chơi.",
        why:"Sao chưa nộp đơn nghỉ việc luôn đi?", whyPh:"Viết câu trả lời thật của bạn. Đọc lại tuần sau.",
        since:"Từ ngày bắt đầu đến nay", days:"ngày", lessons:"kiến thức có thể học", skills:"kỹ năng có thể thử",
        estNote:"Ước tính: mỗi ngày một việc. Tích vào cái bạn đã làm thật.", lessonsTitle:"📚 Kiến thức", skillsTitle:"🛠 Kỹ năng",
        history:"Lịch sử bot Telegram", lesson:"Kiến thức", skill:"Kỹ năng mới", question:"Sao hôm nay chưa phải ngày cuối?", ph:"Trả lời của bạn (lưu trên máy này)" },
  en: { change:"Change", setup:"Whose timeline?", owner:"Bot owner (dates from config, with Telegram history)", guest:"Guest (your own dates, saved on this device)",
        start:"Start date", end:"End date (optional)", note:"Guest dates are saved only in this browser. Sent nowhere.", cancel:"Cancel", save:"Save",
        ownerTag:"Bot owner", guestTag:"Guest", noStart:"no start date yet",
        day:"Day", survived:"survived", tickets:"tickets collected", left:"", daysLeft:"days left", open:"no end date", enter:"Enter your start date to play.",
        why:"Why don't you submit your resignation now?", whyPh:"Write your honest answer. Read it again next week.",
        since:"From your start date until today", days:"days", lessons:"lessons you could learn", skills:"skills you could try",
        estNote:"Estimate: one thing a day. Tick what you actually did.", lessonsTitle:"📚 Lessons", skillsTitle:"🛠 Skills",
        history:"Telegram bot history", lesson:"Lesson", skill:"New skill", question:"Why isn't today the end date?", ph:"Your answer (saved on this device)" },
};
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[ch]));
let lang = ls.get("ll.lang", "vi"), cfg = {}, lessons = [], skills = [], days = [], cards = {}, selected = null;

const isoToday = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const dayDiff = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const hasChosen = () => ls.get("ll.mode", null) !== null;
const mode = () => ls.get("ll.mode", "owner");
const guestDates = () => ls.get("ll.dates", { start: "", end: "" });
const dates = () => mode() === "owner" ? { start: cfg.start_date || "", end: cfg.end_date || "" } : guestDates();
const pickN = (items, n) => items.slice(0, Math.max(0, Math.min(n, items.length)));

function applyText() {
  document.documentElement.lang = lang;
  $("lang").textContent = lang === "vi" ? "EN" : "VI";
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = T[lang][el.dataset.t]);
  $("why").placeholder = T[lang].whyPh;
}

function renderCounter() {
  const d = dates(), t = T[lang], today = isoToday(), isOwner = mode() === "owner";
  $("who").textContent = `${isOwner ? t.ownerTag : t.guestTag} · ${d.start ? `${d.start} → ${d.end || t.open}` : t.noStart}`;
  if (!d.start) { $("counter").textContent = "—"; $("sub").textContent = t.enter; $("personal").classList.add("hidden"); return null; }
  const n = Math.max(0, dayDiff(d.start, today) + 1);
  const total = d.end ? dayDiff(d.start, d.end) + 1 : null;
  const left = total ? Math.max(0, total - n) : null;
  $("counter").textContent = total ? `${t.day} ${n}/${total}` : `${t.day} ${n}`;
  $("sub").textContent = [t.survived, `${n} ${t.tickets}`, total ? `${t.left} ${left} ${t.daysLeft}`.trim() : t.open].join(" · ");
  $("personal").classList.remove("hidden");
  return n;
}

function renderChecklist(id, items, n, key) {
  const done = ls.get("ll.done", {});
  const ul = $(id); ul.innerHTML = "";
  pickN(items, n).forEach((it, i) => {
    const k = `${key}${i}`, li = document.createElement("li");
    li.className = done[k] ? "done" : "";
    li.innerHTML = `<input type="checkbox" ${done[k] ? "checked" : ""}><div><b>${esc(it.topic || it.name)}</b><br>${esc(it[lang])}</div>`;
    li.querySelector("input").onchange = e => { ls.set("ll.done", { ...ls.get("ll.done", {}), [k]: e.target.checked }); li.className = e.target.checked ? "done" : ""; };
    ul.appendChild(li);
  });
}

function renderPersonal(n) {
  if (n === null) return;
  $("sDays").textContent = n;
  $("sLessons").textContent = pickN(lessons, n).length;
  $("sSkills").textContent = pickN(skills, n).length;
  renderChecklist("lessonList", lessons, n, "l");
  renderChecklist("skillList", skills, n, "s");
  $("why").value = ls.get("ll.why", "");
}

function renderOwner() {
  const o = cfg.owner, box = $("ownerCard");
  box.classList.toggle("hidden", mode() !== "owner" || !o);
  if (!o || mode() !== "owner") return;
  const links = Object.entries(o.links || {}).map(([k, v]) => `<a href="${esc(v)}" target="_blank" rel="noopener">${esc(k)}</a>`).join("");
  box.innerHTML = `${o.avatar ? `<img src="${esc(o.avatar)}" alt="">` : ""}<div>
    <b><a href="${esc(o.site || "#")}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${esc(o.name || "")}</a></b> · ${esc(o.role || "")}
    ${o.quote ? `<div class="q">“${esc(o.quote[lang] || o.quote.vi || "")}”</div>` : ""}
    <div class="links">${links}</div></div>`;
}

function renderCard() {
  const c = cards[selected], t = T[lang], box = $("card");
  if (!c) { box.innerHTML = ""; return; }
  const total = c.total_days ? `/${c.total_days}` : "";
  const key = `ll.answer.${c.date}`, saved = ls.get(key, "");
  box.innerHTML = `
    <div class="row"><b>${c.date}</b> · ${t.day} ${c.day_n}${total}</div>
    <img src="${esc(c.meme.url)}" alt="meme" loading="lazy">
    <div class="cap">${esc(c.meme[lang])}</div>
    <div class="row"><b>${t.lesson} · ${esc(c.lesson.topic)}</b><br>${esc(c.lesson[lang])}</div>
    <div class="row"><b>${t.skill} · ${esc(c.skill.name)}</b><br>${esc(c.skill[lang])}</div>
    ${c.ask_question ? `<div class="row"><b>❓ ${t.question}</b><br><textarea id="answer" placeholder="${t.ph}">${esc(saved)}</textarea></div>` : ""}`;
  const ta = $("answer");
  if (ta) ta.addEventListener("input", () => ls.set(key, ta.value));
}

function renderTimeline() {
  const tl = $("timeline"); tl.innerHTML = "";
  $("bot").classList.toggle("hidden", mode() !== "owner" || days.length === 0);
  [...days].reverse().forEach(d => {
    const b = document.createElement("button");
    b.textContent = d.slice(5) + (ls.get(`ll.answer.${d}`, "") ? " ✎" : ""); b.title = d;
    b.className = d === selected ? "on" : "";
    b.onclick = async () => { if (!cards[d]) { try { cards[d] = await getJson(`data/${d}.json`); } catch (e) { console.error(e); } } selected = d; render(); };
    tl.appendChild(b);
  });
}

function render() { applyText(); renderOwner(); renderPersonal(renderCounter()); renderCard(); renderTimeline(); }

function openDialog() {
  const g = guestDates();
  document.querySelector(`input[name=mode][value=${mode()}]`).checked = true;
  $("start").value = g.start || ""; $("end").value = g.end || "";
  syncDialog();
  $("dlg").showModal();
}
const syncDialog = () => $("guestDates").classList.toggle("hidden", document.querySelector("input[name=mode]:checked").value !== "guest");

function saveDialog() {
  if ($("dlg").returnValue !== "save") { if (!hasChosen()) ls.set("ll.mode", "owner"); return; }
  const m = document.querySelector("input[name=mode]:checked").value;
  ls.set("ll.mode", m);
  if (m === "guest") {
    const start = $("start").value, end = $("end").value;
    ls.set("ll.dates", { start, end: end && start && end >= start ? end : "" });
  }
  render();
}

async function getJson(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error(`${url}: ${r.status}`);
  return r.json();
}

async function init() {
  try { [cfg, lessons, skills] = await Promise.all([getJson("config.json"), getJson("lessons.json"), getJson("skills.json")]); } catch (e) { console.error(e); }
  try { days = await getJson("data/index.json"); } catch { days = []; }
  const recent = days.slice(-30);
  await Promise.all(recent.map(async d => { try { cards[d] = await getJson(`data/${d}.json`); } catch (e) { console.error(e); } }));
  selected = recent[recent.length - 1] || null;
  $("lang").onclick = () => { lang = lang === "vi" ? "en" : "vi"; ls.set("ll.lang", lang); render(); };
  $("change").onclick = openDialog;
  document.querySelectorAll("input[name=mode]").forEach(r => r.onchange = syncDialog);
  $("dlg").addEventListener("close", saveDialog);
  $("why").addEventListener("input", () => ls.set("ll.why", $("why").value));
  render();
  if (!hasChosen() || (mode() === "guest" && !guestDates().start)) openDialog();
}
init();
</script>
</body>
</html>
